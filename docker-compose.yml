version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nagar_drishti_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - NAGAR_HMAC_KEY=docker_secret_key_2026
      - STORE_PLAINTEXT_PLATE=false
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nagar_drishti_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
